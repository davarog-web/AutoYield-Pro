<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SynthScale AI | Production v6.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 transition-colors duration-300 font-sans text-slate-900 dark:text-slate-100">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function SynthScaleApp() {
            const [darkMode, setDarkMode] = useState(true);
            const [targetMass, setTargetMass] = useState(500); 
            const [expectedYield, setExpectedYield] = useState(85.0); 
            const [productMW, setProductMW] = useState(350.5); 
            
            const [showSettings, setShowSettings] = useState(false);
            const [benchlingTenant, setBenchlingTenant] = useState("");
            const [benchlingKey, setBenchlingKey] = useState("");
            
            const [isPredicting, setIsPredicting] = useState(false);
            const [mlInsights, setMlInsights] = useState(null);
            const [isExporting, setIsExporting] = useState(false);
            const [exportStatus, setExportStatus] = useState(null);
            const [isSyncing, setIsSyncing] = useState(false);
            
            const fileInputRef = useRef(null);

            const defaultReagents = [
                { id: 1, name: 'Aryl Halide (Substrate A)', mw: 156.0, eq: 1.0, isLiquid: false, inStock: 1200, daysOpen: 12 },
                { id: 2, name: 'Pd(dppf)Cl2 Catalyst', mw: 731.5, eq: 0.05, isLiquid: false, inStock: 5000, daysOpen: 142 },
                { id: 3, name: 'n-Butyllithium', mw: 64.06, eq: 1.1, isLiquid: true, nominalMolarity: 1.6, lastTitratedDays: 45, inStock: 500 } 
            ];
            
            const [reagents, setReagents] = useState(defaultReagents);

            useEffect(() => { document.documentElement.classList.toggle('dark', darkMode); }, [darkMode]);

            const targetMoles = (targetMass / (expectedYield / 100)) / productMW;

            const predictYield = () => {
                setIsPredicting(true); setMlInsights(null); setExportStatus(null);
                setTimeout(() => {
                    let baseYield = 85.0; let degradationPenalty = 0; let scalePenalty = 0;
                    const oldCatalyst = reagents.find(r => r.name.toLowerCase().includes('catalyst') && r.daysOpen > 90);
                    if (oldCatalyst) { degradationPenalty = 14.5; }
                    if (targetMass > 1000) { scalePenalty = 8.0; } else if (targetMass > 500) { scalePenalty = 3.5; }
                    setExpectedYield(baseYield - degradationPenalty - scalePenalty);
                    setMlInsights({ baseYield, degradationPenalty, scalePenalty });
                    setIsPredicting(false);
                }, 1500);
            };

            // PRODUCTION WAY: Sync Inventory via secure Vercel backend
            const syncLiveInventory = async () => {
                if (!benchlingTenant || !benchlingKey) return alert("Please enter API credentials in settings.");
                setIsSyncing(true);
                
                try {
                    const response = await fetch('/api/get-inventory', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ tenant: benchlingTenant, key: benchlingKey, reagentName: 'n-Butyllithium' })
                    });
                    
                    const data = await response.json();
                    if(data.error) throw new Error(data.error);
                    
                    alert("Successfully connected to API backend. Received data payload size: " + JSON.stringify(data).length + " bytes.");
                    // In a live scenario, you would parse data.items[0] and setReagents() here.
                } catch (error) {
                    alert("Backend Error: " + error.message);
                }
                setIsSyncing(false);
            };

            // PRODUCTION WAY: Export payload via secure Vercel backend
            const exportToELN = async () => {
                if (!benchlingTenant || !benchlingKey) {
                    setExportStatus({ type: 'error', message: 'API Error: Benchling Tenant URL and API Key required.' });
                    return;
                }
                setIsExporting(true);
                setExportStatus(null);
                
                const payload = {
                    name: `SynthScale Prep: ${targetMass.toFixed(1)}mg Target`,
                    fields: {
                        "Target Mass": { value: targetMass.toFixed(2) },
                        "Predicted Yield": { value: expectedYield.toFixed(1) }
                    }
                };

                try {
                    const response = await fetch('/api/post-eln', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ tenant: benchlingTenant, key: benchlingKey, payload })
                    });
                    
                    const data = await response.json();
                    if(data.error) throw new Error(data.error);
                    
                    setExportStatus({ type: 'success', message: `POST SUCCESS: Confirmed via Vercel Backend.` });
                } catch (error) {
                    setExportStatus({ type: 'error', message: `Backend Pipeline Failed: ${error.message}` });
                }
                setIsExporting(false);
            };

            return (
                <div className="max-w-2xl mx-auto p-4 flex flex-col gap-6 pb-20">
                    <header className="flex justify-between py-4 items-center border-b border-slate-200 dark:border-slate-800">
                        <div>
                            <h1 className="text-2xl font-black text-emerald-600 dark:text-emerald-400 tracking-tight">SynthScale AI</h1>
                            <p className="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Production Serverless Architecture</p>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={() => setShowSettings(!showSettings)} className="p-3 bg-slate-200 dark:bg-slate-800 rounded-full shadow-inner text-xl">⚙️</button>
                            <button onClick={() => setDarkMode(!darkMode)} className="p-3 bg-slate-200 dark:bg-slate-800 rounded-full shadow-inner text-xl">{darkMode ? '☀️' : '🌙'}</button>
                        </div>
                    </header>

                    {showSettings && (
                        <div className="bg-slate-800 p-6 rounded-3xl shadow-lg border border-slate-700 space-y-4 text-white">
                            <h2 className="text-sm font-bold text-blue-400 uppercase">Enterprise API Configuration</h2>
                            <div className="space-y-3">
                                <div>
                                    <label className="text-[10px] font-bold text-slate-400 uppercase">Benchling Tenant URL</label>
                                    <input type="text" placeholder="e.g., mycompany.benchling.com" className="w-full p-3 bg-slate-900 rounded-xl ring-1 ring-slate-700 font-mono text-sm text-blue-400" value={benchlingTenant} onChange={(e) => setBenchlingTenant(e.target.value)} />
                                </div>
                                <div>
                                    <label className="text-[10px] font-bold text-slate-400 uppercase">Secret API Key</label>
                                    <input type="password" placeholder="••••••••••••••••" className="w-full p-3 bg-slate-900 rounded-xl ring-1 ring-slate-700 font-mono text-sm text-blue-400" value={benchlingKey} onChange={(e) => setBenchlingKey(e.target.value)} />
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="bg-white dark:bg-slate-800 p-6 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-700 space-y-4">
                        <div className="flex justify-between items-center mb-2">
                            <h2 className="text-sm font-bold text-emerald-500 uppercase">Step 1: ML Yield Prediction</h2>
                            <button onClick={predictYield} className="px-4 py-2 text-xs font-bold rounded-xl bg-purple-600 hover:bg-purple-500 text-white shadow-sm">
                                {isPredicting ? 'Analyzing...' : '✨ Run ML Engine'}
                            </button>
                        </div>
                        <div className="grid grid-cols-3 gap-4">
                            <div>
                                <label className="text-[10px] font-bold text-slate-400 uppercase">Target (mg)</label>
                                <input type="number" className="w-full p-3 bg-slate-50 dark:bg-slate-900 rounded-xl ring-1 ring-slate-200 dark:ring-slate-700 font-mono text-lg font-bold text-blue-600 dark:text-blue-400" value={targetMass.toFixed(1)} onChange={(e) => { setTargetMass(Number(e.target.value)); setMlInsights(null); }} />
                            </div>
                            <div>
                                <label className="text-[10px] font-bold text-slate-400 uppercase">Predicted (%)</label>
                                <div className="w-full p-3 bg-slate-50 dark:bg-slate-900 rounded-xl ring-1 ring-slate-200 dark:ring-slate-700 font-mono text-lg font-bold text-slate-900 dark:text-white">
                                    {expectedYield.toFixed(1)}%
                                </div>
                            </div>
                            <div>
                                <label className="text-[10px] font-bold text-slate-400 uppercase">MW</label>
                                <input type="number" className="w-full p-3 bg-slate-50 dark:bg-slate-900 rounded-xl ring-1 ring-slate-200 dark:ring-slate-700 font-mono text-lg text-slate-500" value={productMW} onChange={(e) => setProductMW(Number(e.target.value))} />
                            </div>
                        </div>
                    </div>

                    <div className="bg-white dark:bg-slate-800 p-6 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-700 flex flex-col items-center gap-4">
                        <h2 className="text-sm font-bold text-blue-500 uppercase w-full">Step 2: Backend API Pipelines</h2>
                        
                        <button onClick={syncLiveInventory} disabled={isSyncing} className="w-full py-4 border-2 border-dashed border-blue-500 text-blue-600 dark:text-blue-400 font-black rounded-xl hover:bg-blue-50 dark:hover:bg-blue-900/20 transition-all flex justify-center items-center gap-2">
                            {isSyncing ? 'Pinging Benchling GET Endpoint...' : '🔄 Sync Live Inventory via Backend'}
                        </button>

                        <button onClick={exportToELN} disabled={isExporting} className="w-full py-4 bg-blue-600 hover:bg-blue-500 text-white font-black rounded-xl shadow-md transition-all flex justify-center items-center gap-2 disabled:opacity-70">
                            {isExporting ? 'Executing POST Request...' : '🚀 Push Final Payload via Backend'}
                        </button>
                        
                        {exportStatus && (
                            <div className={`w-full p-4 rounded-xl text-center space-y-2 border ${exportStatus.type === 'error' ? 'bg-rose-50 dark:bg-rose-900/20 border-rose-200 dark:border-rose-800 text-rose-600 dark:text-rose-400' : 'bg-emerald-50 dark:bg-emerald-900/20 border-emerald-200 dark:border-emerald-800 text-emerald-600 dark:text-emerald-400'}`}>
                                <div className="font-bold">{exportStatus.type === 'error' ? 'Serverless Function Failed' : 'Serverless Sync Complete'}</div>
                                <div className="text-xs font-mono opacity-80">{exportStatus.message}</div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SynthScaleApp />);
    </script>
</body>
    </html>
