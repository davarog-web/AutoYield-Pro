<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SynthScale AI | Enterprise v3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 transition-colors duration-300 font-sans text-slate-900 dark:text-slate-100">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function SynthScaleApp() {
            const [darkMode, setDarkMode] = useState(true);
            const [targetMass, setTargetMass] = useState(500); // mg
            const [expectedYield, setExpectedYield] = useState(85.0); // %
            const [productMW, setProductMW] = useState(350.5); // g/mol
            
            const [isPredicting, setIsPredicting] = useState(false);
            const [mlInsights, setMlInsights] = useState(null);
            
            const [isExporting, setIsExporting] = useState(false);
            const [exportToken, setExportToken] = useState(null);
            
            const fileInputRef = useRef(null);

            // Default fallback reagents if no CSV is loaded
            const defaultReagents = [
                { id: 1, name: 'Aryl Halide (Substrate A)', mw: 156.0, eq: 1.0, inStockMg: 1200, daysOpen: 12 },
                { id: 2, name: 'Boronic Acid (Substrate B)', mw: 121.9, eq: 1.2, inStockMg: 450, daysOpen: 45 },
                { id: 3, name: 'Pd(dppf)Cl2 Catalyst', mw: 731.5, eq: 0.05, inStockMg: 5000, daysOpen: 142 }
            ];
            
            const [reagents, setReagents] = useState(defaultReagents);
            const [csvLoaded, setCsvLoaded] = useState(false);

            useEffect(() => { document.documentElement.classList.toggle('dark', darkMode); }, [darkMode]);

            const targetMoles = (targetMass / (expectedYield / 100)) / productMW;

            // --- CSV UPLOAD HANDLER ---
            const handleFileUpload = (event) => {
                const file = event.target.files[0];
                if (!file) return;

                Papa.parse(file, {
                    header: true,
                    dynamicTyping: true,
                    skipEmptyLines: true,
                    complete: function(results) {
                        const parsedReagents = results.data.map((row, index) => ({
                            id: Date.now() + index,
                            name: row.name || `Unknown Reagent ${index}`,
                            mw: parseFloat(row.mw) || 100,
                            eq: parseFloat(row.eq) || 1.0,
                            inStockMg: parseFloat(row.inStockMg) || 0,
                            daysOpen: parseInt(row.daysOpen) || 0
                        }));
                        setReagents(parsedReagents);
                        setCsvLoaded(true);
                        setMlInsights(null); // Reset insights for new data
                        setExpectedYield(85.0); // Reset base yield
                    }
                });
            };

            const predictYield = () => {
                setIsPredicting(true);
                setMlInsights(null);
                setExportToken(null);
                
                setTimeout(() => {
                    let baseYield = 85.0;
                    let degradationPenalty = 0;
                    let scalePenalty = 0;

                    const oldCatalyst = reagents.find(r => r.name.toLowerCase().includes('catalyst') && r.daysOpen > 90);
                    if (oldCatalyst) {
                        degradationPenalty = 14.5;
                    }

                    if (targetMass > 1000) {
                        scalePenalty = 8.0; 
                    } else if (targetMass > 500) {
                        scalePenalty = 3.5;
                    }

                    const finalYield = baseYield - degradationPenalty - scalePenalty;
                    
                    setExpectedYield(finalYield);
                    setMlInsights({ baseYield, degradationPenalty, scalePenalty });
                    setIsPredicting(false);
                }, 1500);
            };

            const scaleToLimit = (reagent) => {
                const maxTargetMoles = (reagent.inStockMg / reagent.mw) / reagent.eq;
                const newTargetMass = maxTargetMoles * productMW * (expectedYield / 100);
                setTargetMass(newTargetMass);
                setExportToken(null);
            };

            const exportToELN = () => {
                setIsExporting(true);
                setTimeout(() => {
                    setIsExporting(false);
                    setExportToken(`ELN-POST-SUCCESS: BATCH-${Math.floor(Math.random() * 100000)}`);
                }, 1200);
            };

            return (
                <div className="max-w-2xl mx-auto p-4 flex flex-col gap-6 pb-20">
                    <header className="flex justify-between py-4 items-center border-b border-slate-200 dark:border-slate-800">
                        <div>
                            <h1 className="text-2xl font-black text-emerald-600 dark:text-emerald-400 tracking-tight">SynthScale AI</h1>
                            <p className="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Enterprise Middleware v3.0</p>
                        </div>
                        <button onClick={() => setDarkMode(!darkMode)} className="p-3 bg-slate-200 dark:bg-slate-800 rounded-full shadow-inner text-xl">
                            {darkMode ? '☀️' : '🌙'}
                        </button>
                    </header>

                    {/* Step 0: CSV Data Ingestion */}
                    <div className="bg-white dark:bg-slate-800 p-6 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-700 space-y-4">
                        <div className="flex justify-between items-center">
                            <h2 className="text-sm font-bold text-blue-500 uppercase">Step 0: Load Inventory Context</h2>
                            {csvLoaded && <span className="px-2 py-1 bg-emerald-100 text-emerald-600 text-[10px] uppercase font-black rounded border border-emerald-200">Data Synced</span>}
                        </div>
                        <div className="flex items-center gap-4">
                            <input 
                                type="file" 
                                accept=".csv" 
                                ref={fileInputRef}
                                onChange={handleFileUpload}
                                className="hidden" 
                            />
                            <button 
                                onClick={() => fileInputRef.current.click()}
                                className="w-full py-3 border-2 border-dashed border-slate-300 dark:border-slate-600 rounded-xl text-slate-500 dark:text-slate-400 font-bold text-sm hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors"
                            >
                                📥 Upload .CSV Inventory Export
                            </button>
                        </div>
                    </div>

                    {/* Step 1: Target & Context-Aware Prediction */}
                    <div className="bg-white dark:bg-slate-800 p-6 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-700 space-y-4">
                        <div className="flex justify-between items-center mb-2">
                            <h2 className="text-sm font-bold text-emerald-500 uppercase">Step 1: ML Yield Prediction</h2>
                            <button 
                                onClick={predictYield}
                                className={`px-4 py-2 text-xs font-bold rounded-xl flex items-center gap-2 transition-all shadow-sm ${isPredicting ? 'bg-amber-100 text-amber-600' : 'bg-purple-600 hover:bg-purple-500 text-white'}`}
                            >
                                {isPredicting ? 'Analyzing Context...' : '✨ Run ML Prediction Engine'}
                            </button>
                        </div>
                        
                        <div className="grid grid-cols-3 gap-4">
                            <div>
                                <label className="text-[10px] font-bold text-slate-400 uppercase">Target Mass (mg)</label>
                                <input type="number" className="w-full p-3 bg-slate-50 dark:bg-slate-900 rounded-xl ring-1 ring-slate-200 dark:ring-slate-700 font-mono text-lg font-bold text-blue-600 dark:text-blue-400" value={targetMass.toFixed(1)} onChange={(e) => { setTargetMass(Number(e.target.value)); setMlInsights(null); }} />
                            </div>
                            <div>
                                <label className="text-[10px] font-bold text-slate-400 uppercase">Predicted Yield (%)</label>
                                <div className={`w-full p-3 rounded-xl ring-1 font-mono text-lg font-bold ${mlInsights ? 'bg-purple-50 dark:bg-purple-900/20 ring-purple-300 dark:ring-purple-700 text-purple-600 dark:text-purple-400' : 'bg-slate-50 dark:bg-slate-900 ring-slate-200 dark:ring-slate-700 text-slate-900 dark:text-white'}`}>
                                    {expectedYield.toFixed(1)}%
                                </div>
                            </div>
                            <div>
                                <label className="text-[10px] font-bold text-slate-400 uppercase">Product MW</label>
                                <input type="number" className="w-full p-3 bg-slate-50 dark:bg-slate-900 rounded-xl ring-1 ring-slate-200 dark:ring-slate-700 font-mono text-lg text-slate-500" value={productMW} onChange={(e) => setProductMW(Number(e.target.value))} />
                            </div>
                        </div>

                        {mlInsights && (
                            <div className="mt-4 p-4 bg-slate-50 dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-700 text-xs font-mono">
                                <div className="text-slate-500 mb-2 font-bold uppercase tracking-wider text-[10px]">ML Model Execution Log</div>
                                <div className="flex justify-between text-slate-600 dark:text-slate-400"><span>Historical Base Yield:</span> <span>{mlInsights.baseYield.toFixed(1)}%</span></div>
                                {mlInsights.degradationPenalty > 0 && <div className="flex justify-between text-rose-500 mt-1"><span>Reagent Degradation Penalty (Catalyst > 90d):</span> <span>-{mlInsights.degradationPenalty.toFixed(1)}%</span></div>}
                                {mlInsights.scalePenalty > 0 && <div className="flex justify-between text-amber-500 mt-1"><span>Scale Variance Penalty (Mass > 500mg):</span> <span>-{mlInsights.scalePenalty.toFixed(1)}%</span></div>}
                                <div className="flex justify-between font-bold text-purple-600 dark:text-purple-400 border-t border-slate-200 dark:border-slate-700 mt-2 pt-2"><span>Adjusted Context-Aware Yield:</span> <span>{expectedYield.toFixed(1)}%</span></div>
                            </div>
                        )}
                    </div>

                    {/* Step 2: Auto-Scaled Reagents with Inventory & Degradation Check */}
                    <div className="bg-white dark:bg-slate-800 p-6 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-700 space-y-4">
                        <h2 className="text-sm font-bold text-emerald-500 uppercase mb-4">Step 2: Dynamic Inventory Intercept</h2>
                        
                        <div className="space-y-4">
                            {reagents.map(r => {
                                const reqMass = targetMoles * r.eq * r.mw;
                                const isShort = reqMass > r.inStockMg;
                                const isDegraded = r.daysOpen > 90 && r.name.toLowerCase().includes('catalyst');
                                
                                return (
                                    <div key={r.id} className={`p-4 rounded-2xl ring-2 transition-all ${isShort ? 'bg-rose-50 dark:bg-rose-900/10 ring-rose-400 dark:ring-rose-500' : 'bg-slate-50 dark:bg-slate-900 ring-slate-200 dark:ring-slate-700'}`}>
                                        <div className="flex justify-between items-start mb-2">
                                            <div>
                                                <div className="font-bold text-md flex items-center gap-2">
                                                    {r.name} 
                                                    {isDegraded && <span className="px-2 py-0.5 bg-rose-100 text-rose-600 text-[9px] uppercase font-black rounded border border-rose-200">Aged Reagent</span>}
                                                </div>
                                                <div className="text-xs text-slate-500 font-mono mt-1">MW: {r.mw} | EQ: {r.eq}</div>
                                            </div>
                                            <div className="text-right">
                                                <div className="text-xs font-bold text-slate-400 uppercase mb-1">Required Mass</div>
                                                <div className={`text-xl font-black font-mono ${isShort ? 'text-rose-600 dark:text-rose-400' : 'text-slate-700 dark:text-slate-200'}`}>
                                                    {reqMass.toFixed(1)} mg
                                                </div>
                                            </div>
                                        </div>
                                        
                                        <div className="mt-4 pt-3 border-t border-slate-200 dark:border-slate-700/50 flex justify-between items-center">
                                            <div className="flex gap-4">
                                                <div className="flex items-center gap-1.5 text-xs font-bold font-mono">
                                                    <span className="text-slate-400 uppercase">Stock:</span>
                                                    <span className={isShort ? 'text-rose-500' : 'text-emerald-500'}>{r.inStockMg.toFixed(1)} mg</span>
                                                </div>
                                                <div className="flex items-center gap-1.5 text-xs font-bold font-mono border-l border-slate-300 dark:border-slate-600 pl-4">
                                                    <span className="text-slate-400 uppercase">Open:</span>
                                                    <span className={isDegraded ? 'text-rose-500' : 'text-slate-500 dark:text-slate-400'}>{r.daysOpen} days</span>
                                                </div>
                                            </div>
                                            
                                            {isShort && (
                                                <button 
                                                    onClick={() => scaleToLimit(r)}
                                                    className="px-3 py-1.5 bg-rose-600 hover:bg-rose-700 text-white text-[10px] font-black uppercase rounded-lg shadow-md transition-colors"
                                                >
                                                    Scale to Max Stock
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                )
                            })}
                        </div>
                    </div>

                    {/* Step 3: Execution Loop */}
                    <div className="bg-white dark:bg-slate-800 p-6 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-700 flex flex-col items-center gap-4">
                        <h2 className="text-sm font-bold text-emerald-500 uppercase w-full">Step 3: Execution Payload</h2>
                        
                        {!exportToken ? (
                            <button 
                                onClick={exportToELN}
                                disabled={isExporting}
                                className="w-full py-4 bg-indigo-600 hover:bg-indigo-500 text-white font-black rounded-xl shadow-md transition-all flex justify-center items-center gap-2 disabled:opacity-70"
                            >
                                {isExporting ? 'Transmitting via API...' : '🚀 Export Optimized Grid to ELN'}
                            </button>
                        ) : (
                            <div className="w-full p-4 bg-emerald-50 dark:bg-emerald-900/20 border border-emerald-200 dark:border-emerald-800 rounded-xl text-center space-y-2">
                                <div className="text-emerald-600 dark:text-emerald-400 font-bold">Successfully Pushed to Lab Notebook</div>
                                <div className="text-xs font-mono text-emerald-500 dark:text-emerald-500/70">{exportToken}</div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SynthScaleApp />);
    </script>
</body>
</html>
